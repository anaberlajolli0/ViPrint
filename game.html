  { bass: 45, arp: [57, 60, 64, 69] },   // Am (A2 / A C E A)

  drawer = { mid: mid, correctIdx: list.indexOf(order.folders[mid]), wrong: [], cards: cards };
  if (drawer.correctIdx < 0) drawer.correctIdx = 0;   // safety fallback
  // fair moment to read the brief before the clock bites

  if (hudEls.drTitle) hudEls.drTitle.textContent = BY_ID[mid].name.toUpperCase() + ' DRAWER';
  buildDrawerFolders(cards);
  showDrawer();
  positionDrawer();
  SFX.print();

}

function moveToward(ent, tx, ty, speed, dt) {
  var dx = tx - ent.x, dy = ty - ent.y;
  var d = Math.sqrt(dx * dx + dy * dy);
  var sp = speed * dt;
  if (d <= sp) { ent.x = tx; ent.y = ty; return true; }
  ent.x += dx / d * sp; ent.y += dy / d * sp; return false;
}

/* ---------------- Update ---------------- */
function update(dt) {
  if (state === 'paused') return;   // freeze the factory while paused
  t += dt;
  if (flashT > 0) flashT -= dt;
  if (shakeT > 0) shakeT -= dt;
  if (hintT > 0 && state === 'play') hintT -= dt;

  // operators (each machine's attendant) + runner (order carrier) choreography
  if (state === 'play') {
    // --- operators: wrong deliveries make their machine's operator print ---
    for (var oi = 0; oi < operators.length; oi++) {
      var op = operators[oi];
      if (op.state === 'operate') {
        op.opT -= dt;
        var om = machineById(op.mid);
        if (om) om.flash = Math.max(om.flash, 0.35);
        if (op.opT <= 0) {
          op.state = 'idle';
          applyResult(op.mid);          // wrong machine: penalty lands here
        }
      }
      op.bob += dt * (op.state === 'operate' ? 12 : 3);
    }

    // --- runner: fetches the box only after the PLAYER picks it up from the belt ---
    switch (runner.state) {
      case 'wait':
        break;                                // waits at his post until the order is picked up
      case 'fetch':
        if (moveToward(runner, 192, 44, 165, dt)) {
          runner.box = true;
          if (runner.pending) {
            runner.state = 'deliver';
            runnerDeliverTarget(runner.pending);
          } else runner.state = 'ready';
        }
        break;
      case 'ready':
        break;
      case 'deliver':
        if (moveToward(runner, runner.hx, runner.hy, 165, dt)) {
          runner.state = 'handoff'; runner.opT = 0.35;
        }
        break;
      case 'handoff':
        runner.opT -= dt;
        if (runner.opT <= 0) {
          runner.box = false;
          var hm = runner.pending;
          if (isCorrectMachine(hm)) {
            openDrawer(hm);               // right machine: the drawer slides out with its folders
          } else {
            var wop = operatorFor(hm);    // wrong machine: its operator prints, penalty at the end
            if (wop) { wop.state = 'operate'; wop.opT = 0.5; beginOperate(hm); }
            SFX.print();
          }
          runner.state = 'return';
          runner.hx = 192; runner.hy = 48;
        }
        break;
      case 'carryback':
        if (moveToward(runner, 372, 42, 165, dt)) {
          runner.box = false;                       // drop the lost order at the far end
          runner.state = 'return';
          runner.hx = 192; runner.hy = 48;
          missAnim = { phase: 'drop', t: 0, dur: 0.35 };
          burst(372, 38, '#ff6b6b', 6);
        }
        break;
      case 'return':
        if (moveToward(runner, 192, 48, 165, dt)) {
          runner.state = 'wait'; runner.pending = null;
        }
        break;
    }
    runner.bob += dt * ((runner.state === 'fetch' || runner.state === 'deliver' || runner.state === 'return' || runner.state === 'carryback') ? 9 : 3);

    // order spawn
    if (!order) {
      orderDelay -= dt;
      if (orderDelay <= 0) makeOrder();
    } else if (!missing) {
      order.timer -= dt;
      if (order.timer <= 0) { order.timer = 0; startMissAnim(); }
    }
    // the order's box rides the belt until the player picks it up
    if (order && !runner.box && !drawer && !missing) beltT += dt;
    // lost-order animation: the box rides down the OTHER half of the belt and falls off
    if (missing && missAnim) {
      missAnim.t += dt;
      if (missAnim.phase === 'ride' && missAnim.t >= missAnim.dur) {
        missAnim.phase = 'drop'; missAnim.t = 0; missAnim.dur = 0.35;
      } else if (missAnim.phase === 'drop' && missAnim.t >= missAnim.dur) {
        finishMiss();
      }
    }
  }

  // machines decay
  MACHINES.forEach(function (m) {
    if (m.flash > 0) m.flash -= dt;
    if (m.buzz > 0) m.buzz -= dt;
  });

  // particles
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  // popups (view-space, seconds)
  for (var j = popups.length - 1; j >= 0; j--) {
    var pp = popups[j];
    pp.life -= dt; pp.y += pp.vy * dt;
    if (pp.life <= 0) popups.splice(j, 1);
  }
  // flying products (world-space)
  for (var k = flying.length - 1; k >= 0; k--) {
    var f = flying[k];
    f.t += dt;
    if (f.t >= f.dur) {
      flying.splice(k, 1);
      burst(f.tx, f.ty, f.color, 10);
    } else {
      var u = f.t / f.dur;
      var ease = 1 - Math.pow(1 - u, 3);
      f.x = f.sx + (f.tx - f.sx) * ease;
      f.y = f.sy + (f.ty - f.sy) * ease - Math.sin(Math.PI * u) * 46;
    }
  }
}

function drawMachine(m) {

  var bx = x + buzz;

  // layered neon glow halo (chunky pixel glow)
  for (var g = 3; g >= 1; g--) {
    wctx.strokeStyle = 'rgba(' + rgb + ',' + (0.055 * (4 - g)).toFixed(3) + ')';
    wctx.lineWidth = 1;
    wctx.strokeRect(bx - g, y - g, w + g * 2, h + g * 2);
  }
  // body: near-black industrial with subtle depth
  rr(wctx, bx, y, w, h, '#12141c');
  rr(wctx, bx, y + Math.floor(h * 0.55), w, h - Math.floor(h * 0.55), '#0c0e15');

  rr(wctx, bx, y, 2, h, 'rgba(255,255,255,0.05)');
  rr(wctx, bx + w - 2, y, 2, h, 'rgba(0,0,0,0.45)');
  rr(wctx, bx, y + h - 2, w, 2, 'rgba(0,0,0,0.50)');

  wctx.strokeStyle = 'rgba(' + rgb + ',0.35)';

  // pulsing neon top strip
  var pulse = 0.6 + 0.4 * Math.sin(t * 3 + m.id.length);
  rr(wctx, bx + 3, y + 3, w - 6, 3, prod.color);
  rr(wctx, bx + 3, y + 3, w - 6, 1, 'rgba(255,255,255,' + (0.4 * pulse).toFixed(2) + ')');
  // cyan cooling vents
  rr(wctx, bx + 4, y + h - 20, 9, 1, 'rgba(0,229,255,0.55)');

  rr(wctx, bx + w - 11, y + 7, 5, 5, 'rgba(' + hexRgb(led) + ',0.25)');
  rr(wctx, bx + w - 10, y + 8, 3, 3, led);

  var sc = active ? '#ffffff' : (m.buzz > 0 ? '#ff2e6f' : 'rgba(0,229,255,0.9)');
  rr(wctx, bx + 8, y + h - 13, w - 16, 5, sc);
  rr(wctx, bx + 8, y + h - 13, w - 16, 1, 'rgba(255,255,255,0.5)');
  rr(wctx, bx + 8, y + h - 10, w - 16, 1, 'rgba(0,0,0,0.45)');
  // product icon on front (large & clear)
  drawMap(wctx, ICON_MAPS[prod.icon], ICON_PAL, bx + (w - 24) / 2, y + 9, 3);
  // hover: neon white ring
  if (hitMachine(m, mouse.wx, mouse.wy) && state === 'play') {
    wctx.strokeStyle = '#ffffff';
    wctx.lineWidth = 1;
    wctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
    wctx.strokeStyle = 'rgba(255,255,255,0.28)';
    wctx.strokeRect(x - 4, y - 4, w + 8, h + 8);

  }

  // revealing a dark cavity with the folder tabs peeking out

    var cutY = y + h - 18;                          // where the face separates from the body

      rr(wctx, bx + 5 + ft * stepW + 1, cutY + drop + 10, stepW - 2, 1, 'rgba(' + hexRgb(fcol) + ',0.75)');
    }

    rr(wctx, bx + 8, fy + 5, w - 16, 5, active ? '#ffffff' : 'rgba(0,229,255,0.9)');

}
function hitMachine(m, wx, wy) {
  return wx >= m.x && wx <= m.x + m.w && wy >= m.y && wy <= m.y + m.h;
}
function machineAt(wx, wy) {
  for (var i = 0; i < MACHINES.length; i++) {
    if (hitMachine(MACHINES[i], wx, wy)) return MACHINES[i];
  }

}
/* Stardew-style human sprite: dark outline silhouette + hair/face/shirt/pants/boots.
   Parts are drawn shifted ±1px in outline color first (cheap silhouette outline),
   then in their real colors on top. */
function buildHumanParts(opt, x, y) {
  var P = [];
  function add(xx, yy, w, h, col) { P.push([xx, yy, w, h, col]); }
  var step = Math.sin(opt.bob) > 0 ? 1 : 0;
  var walk = opt.walk;
  var l1 = walk ? step * 2 : 0, l2 = walk ? (1 - step) * 2 : 0;
  var sway = walk ? (step ? 1 : -1) : 0;
  // head: cap + hair + neck
  add(x - 5, y - 25, 10, 3, opt.cap);
  add(x - 5, y - 24, 2, 2, opt.capShade);          // cap brim
  add(x - 4, y - 22, 8, 7, opt.hair);
  add(x - 2, y - 21, 4, 2, opt.hairHi);            // hair highlight
  add(x - 3, y - 15, 6, 2, opt.skin);              // neck
  add(x - 3, y - 15, 2, 2, opt.skinShade);
  // torso
  add(x - 6, y - 13, 12, 8, opt.shirt);
  add(x - 6, y - 13, 2, 8, opt.shirtShade);
  add(x + 4, y - 13, 2, 2, opt.shirtHi);
  if (opt.stripe) add(x - 5, y - 9, 10, 2, opt.stripe);   // hi-vis stripe
  // arms (+ hands)
  if (opt.carry) {
    add(x - 8, y - 18, 2, 7, opt.shirt);
    add(x + 7, y - 18, 2, 7, opt.shirt);
    add(x - 8, y - 12, 2, 2, opt.skin);
    add(x + 7, y - 12, 2, 2, opt.skin);
  } else if (opt.operate) {
    add(x - 8, y - 15, 2, 5, opt.shirt);
    add(x + 7, y - 15, 2, 5, opt.shirt);
    add(x - 8, y - 11, 2, 2, opt.skin);
    add(x + 7, y - 11, 2, 2, opt.skin);
  } else {
    add(x - 8, y - 12 + sway, 2, 6, opt.shirt);
    add(x + 7, y - 12 - sway, 2, 6, opt.shirt);
    add(x - 8, y - 6 + sway, 2, 3, opt.skin);
    add(x + 7, y - 6 - sway, 2, 3, opt.skin);
  }
  // belt + pants
  add(x - 6, y - 6, 12, 2, opt.pants);
  add(x - 1, y - 6, 3, 2, '#ffd166');              // belt buckle
  add(x - 5, y - 5, 10, 3, opt.pants);
  // legs + boots (walk alternation)
  add(x - 4, y - 4 - l1, 3, 4, opt.pants);
  add(x + 2, y - 4 - l2, 3, 4, opt.pants);
  add(x - 5, y - 2 - l1, 4, 3, opt.boot);
  add(x + 2, y - 2 - l2, 4, 3, opt.boot);
  return P;
}
function drawHuman(opt, x, y) {
  var parts = buildHumanParts(opt, x, y);
  var O = opt.outline;
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    rr(wctx, p[0] - 1, p[1], p[2], p[3], O);
    rr(wctx, p[0] + 1, p[1], p[2], p[3], O);
    rr(wctx, p[0], p[1] - 1, p[2], p[3], O);
    if (p[1] + p[3] < y + 1) rr(wctx, p[0], p[1] + 1, p[2], p[3], O);
  }
  for (var j = 0; j < parts.length; j++) {
    var q = parts[j];
    rr(wctx, q[0], q[1], q[2], q[3], q[4]);
  }
}
/* each machine's attendant: Stardew-style human, cap in the machine's color */
function drawOperator(op) {
  var look = OPERATOR_LOOKS[op.mid];
  drawHuman({
    outline: '#15151d',
    skin: '#f2c9a0', skinShade: '#d9a878',
    hair: look.hair, hairHi: look.hairHi,
    cap: BY_ID[op.mid].color, capShade: look.capShade,
    shirt: look.shirt, shirtShade: look.shirtShade, shirtHi: look.shirtHi,
    pants: '#3a3f4c', boot: '#4a3b33',
    walk: false,
    operate: op.state === 'operate',
    carry: false,
    bob: op.bob

}
function drawWorld() {
  // LAYER 0 — floor, decor, conveyor, dust, belt box (under everything)
  wctx = wbFloorCtx;
  wbFloorCtx.clearRect(0, 0, WBW, WBH);
  drawFloor();
  drawConveyor();
  drawDust();
  // the order's box rides the belt, drops off the edge, and waits to be picked up
  var bbox = beltBoxPos();
  if (bbox) {
    var bob = Math.sin(t * 6) * 1.5;
    drawOrderBox(bbox.x - 20, bbox.y - 9 + bob, 40, 18);
    if (bbox.ready) {
      var pu = 0.5 + 0.5 * Math.sin(t * 5);
      rr(wctx, bbox.x - 26, bbox.y + 10, 52, 2, 'rgba(255,209,102,' + (0.25 + 0.3 * pu).toFixed(2) + ')');
      rr(wctx, bbox.x - 3, bbox.y + 8, 6, 2, 'rgba(255,209,102,' + (0.35 + 0.4 * pu).toFixed(2) + ')');
      rr(wctx, bbox.x - 2, bbox.y - 12, 4, 4, 'rgba(255,209,102,' + (0.3 + 0.45 * pu).toFixed(2) + ')');
    }
  }
  // a lost order: the box rides down the other half of the belt and falls off the end
  var mpos = missBoxPos();
  if (mpos) drawOrderBox(mpos.x - 20, mpos.y - 9, 40, 18);

  // LAYER 2 — entities, depth-sorted: machines anchor at their mid-line,
  // characters at their feet — so a character above a machine is drawn
  // first (machine masks them) and below it drawn last (they mask it).
  wctx = wbTopCtx;
  wbTopCtx.clearRect(0, 0, WBW, WBH);
  var ents = [];
  for (var i = 0; i < MACHINES.length; i++) {
    (function (m) {
      ents.push({ y: m.y + m.h * 0.5, fn: function () { drawMachine(m); } });
    })(MACHINES[i]);
  }
  for (var oi2 = 0; oi2 < operators.length; oi2++) {
    (function (op) { ents.push({ y: op.y, fn: function () { drawOperator(op); } }); })(operators[oi2]);
  }
  ents.push({ y: runner.y, fn: drawRunner });
  ents.sort(function (a, b) { return a.y - b.y; });
  for (var j = 0; j < ents.length; j++) ents[j].fn();

  // flying products + confetti above everything
  flying.forEach(function (f) {
    drawMap(wctx, ICON_MAPS[f.icon], ICON_PAL, Math.round(f.x - 8), Math.round(f.y - 8), 2);
  });
  particles.forEach(function (p) {
    rr(wctx, Math.round(p.x), Math.round(p.y), p.size, p.size, p.color);
  });
  wctx = wbFloorCtx;
}
/* shared order-box sprite (belt box, carried box, handoff box) */
function drawOrderBox(bx, by, w, h) {
  rr(wctx, bx, by, w, h, '#7c4f2c');
  rr(wctx, bx + 1, by + 1, w - 2, h - 2, '#a9713f');
  rr(wctx, bx + 1, by + 1, w - 2, Math.max(2, Math.floor(h * 0.2)), '#c08a52');
  rr(wctx, bx + 1, by + Math.floor(h * 0.45), w - 2, 2, '#7c4f2c');
  var pc = order ? BY_ID[order.items[0]].color : '#888888';
  rr(wctx, bx + Math.floor(w * 0.28), by + Math.floor(h * 0.22), Math.floor(w * 0.44), Math.max(2, Math.floor(h * 0.4)), '#ffffff');
  rr(wctx, bx + Math.floor(w * 0.28), by + Math.floor(h * 0.22), Math.floor(w * 0.44), 2, pc);

/* the order-runner NPC: picks up orders from the belt and carries them to machines */
function drawRunner() {
  drawHuman({
    outline: '#15151d',
    skin: '#f2c9a0', skinShade: '#d9a878',
    hair: '#2a2a33', hairHi: '#4a4a55',
    cap: '#3a3f4c', capShade: '#2c2f38',   // neutral cap — he works the belt, not a machine
    shirt: '#e8863a', shirtShade: '#c56a28', shirtHi: '#ffd166',
    stripe: '#ffd166',
    pants: '#3a3f4c', boot: '#4a3b33',
    walk: runner.state === 'fetch' || runner.state === 'deliver' || runner.state === 'return',
    operate: false,
    carry: runner.box && runner.state !== 'handoff',
    bob: runner.bob
  }, runner.x, runner.y);
  // box carried above the head
  if (runner.box && runner.state !== 'handoff') {
    drawOrderBox(runner.x - 8, runner.y - 28, 16, 11);
  }
  // handoff: box slides from the hands onto the machine
  if (runner.state === 'handoff') {
    var f = 1 - Math.max(0, runner.opT) / 0.35;
    var bx2 = (runner.x - 8) + (runner.dx - (runner.x - 8)) * f;
    var by2 = (runner.y - 28) + (runner.dy - (runner.y - 28)) * f;
    drawOrderBox(Math.round(bx2), Math.round(by2), 16, 11);
  }
}

/* ---------------- Soft drop shadows (Canvas shadow API) ---------------- */
function drawSoftShadow(vx, vy, rx, ry, blur, offY, alpha) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,' + (alpha || 0.4) + ')';
  ctx.shadowBlur = blur;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = offY;
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(vx, vy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
/* draws a soft drop shadow beneath every machine and character, between the
   floor layer and the entity layer, so bodies cover the shadow core and only
   the blurred halo remains visible on the floor. */
function drawEntityShadows() {
  var kx = VW / WBW, ky = VH / WBH;
  for (var i = 0; i < MACHINES.length; i++) {
    var m = MACHINES[i];
    drawSoftShadow((m.x + m.w / 2) * kx, (m.y + m.h * 0.62) * ky,
      m.w * 0.42 * kx, m.h * 0.26 * ky, 22, 12, 0.42);
  }
  for (var si = 0; si < operators.length; si++) {
    drawSoftShadow(operators[si].x * kx, operators[si].y * ky, 11 * kx, 4.4 * ky, 9, 5, 0.4);
  }
  drawSoftShadow(runner.x * kx, runner.y * ky, 11 * kx, 4.4 * ky, 9, 5, 0.4);
}

/* ---------------- Ambient neon illumination nodes ----------------
   Additive ('lighter') radial bloom radiating from each machine screen:
   green for Packaging, purple for Books, blue for Cards, pink for Flyers,
   orange for Posters. Pulses gently; flares up while printing. */
function drawNeonGlow(m) {
  var prod = BY_ID[m.id];
  var active = m.flash > 0;
  var kx = VW / WBW, ky = VH / WBH;
  var vx = (m.x + m.w / 2) * kx;
  var vy = (m.y + m.h - 13) * ky;                  // screen position
  var pulse = 0.5 + 0.5 * Math.sin(t * 2.2 + m.id.length * 1.7);
  var r = Math.max(24, (active ? 150 : 66 + 30 * pulse) * kx * 0.62);
  var g = ctx.createRadialGradient(vx, vy, 2, vx, vy, r);
  g.addColorStop(0, 'rgba(' + hexRgb(prod.color) + ',' + (active ? 0.34 : (0.15 + 0.11 * pulse)).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(' + hexRgb(prod.color) + ',0)');
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';        // additive bloom
  ctx.fillStyle = g;
  ctx.fillRect(vx - r, vy - r, r * 2, r * 2);
  ctx.restore();
}

/* ---------------- Ambient lighting (crisp overlay) ---------------- */
function drawLighting() {
  // warm light pool from the ceiling
  var g = ctx.createRadialGradient(VW / 2, VH * 0.34, VH * 0.08, VW / 2, VH * 0.52, VH * 0.92);
  g.addColorStop(0, 'rgba(255,244,214,0.12)');
  g.addColorStop(0.55, 'rgba(255,244,214,0.03)');
  g.addColorStop(1, 'rgba(12,8,24,0.30)');
  ctx.fillStyle = g;
  rr(ctx, 0, 0, VW, VH, g);
  // corner vignette
  var v = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.45, VW / 2, VH / 2, VH * 0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.28)');
  ctx.fillStyle = v;
  rr(ctx, 0, 0, VW, VH, v);
}

/* ---------------- Pause ---------------- */
function togglePause() {
  ensureAudio();
  if (state === 'play') { state = 'paused'; SFX.click(); }
  else if (state === 'paused') { state = 'play'; SFX.click(); }
}
function hitPauseBtn(vx, vy) {
  var s = 40 * uiScale;
  var x = VW - 130 * uiScale, y = 14 * uiScale;
  return vx >= x && vx <= x + s && vy >= y && vy <= y + s;
}
function drawPauseBtn() {
  if (state !== 'play' && state !== 'paused') return;
  var s = 40 * uiScale, x = VW - 130 * uiScale, y = 14 * uiScale;
  var hov = mouse.vx >= x && mouse.vx <= x + s && mouse.vy >= y && mouse.vy <= y + s;
  ctx.fillStyle = hov ? '#3d3f4c' : '#23242c';
  rr(ctx, x, y, s, s, ctx.fillStyle);
  ctx.strokeStyle = hov ? '#e947a5' : '#3d3f4c'; ctx.lineWidth = 2 * uiScale;
  ctx.strokeRect(x, y, s, s);
  ctx.fillStyle = '#fff';
  if (state === 'paused') {
    ctx.beginPath();
    ctx.moveTo(x + 16 * uiScale, y + 11 * uiScale);
    ctx.lineTo(x + 16 * uiScale, y + 29 * uiScale);
    ctx.lineTo(x + 28 * uiScale, y + 20 * uiScale);
    ctx.closePath();
    ctx.fill();
  } else {
    rr(ctx, x + 13 * uiScale, y + 11 * uiScale, 5 * uiScale, 18 * uiScale, '#fff');
    rr(ctx, x + 22 * uiScale, y + 11 * uiScale, 5 * uiScale, 18 * uiScale, '#fff');
  }
}
function drawPause() {
  ctx.fillStyle = 'rgba(10,10,14,0.78)'; rr(ctx, 0, 0, VW, VH, 'rgba(10,10,14,0.78)');
  var cw = 420 * uiScale, ch = 290 * uiScale;
  var cx = (VW - cw) / 2, cy = (VH - ch) / 2 - 10 * uiScale;
  panel(cx, cy, cw, ch, '#1b1c24');
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#ffd166'; ctx.font = font(26, true);
  ctx.fillText('PAUSED', VW / 2, cy + 36 * uiScale);
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = font(9, true);
  ctx.fillText('THE FACTORY IS WAITING FOR YOU', VW / 2, cy + 78 * uiScale);
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = font(8, true);
  ctx.fillText('P / ESC TO RESUME', VW / 2, cy + 108 * uiScale);
  var bw = 240 * uiScale, bh = 50 * uiScale;
  buttons = [
    { x: VW / 2 - bw / 2, y: cy + 144 * uiScale, w: bw, h: bh, label: 'RESUME', size: 14, fn: togglePause },
    { x: VW / 2 - bw / 2, y: cy + 206 * uiScale, w: bw, h: bh, label: 'RESTART', size: 11, fn: startGame }
  ];
  drawButtons();
}

/* ---------------- DOM HUD sync + game-feel juice ---------------- */
var hudEls = {
  root: document.getElementById('hud'),
  score: document.getElementById('hudScore'),
  combo: document.getElementById('hudCombo'),
  level: document.getElementById('hudLevel'),
  card: document.getElementById('order-card'),
  items: document.getElementById('ocItems'),
  time: document.getElementById('ocTime'),
  fill: document.getElementById('ocFill'),
  bar: document.getElementById('healthbar'),
  pause: document.getElementById('pauseBtn'),
  banner: document.getElementById('banner'),
  drawer: document.getElementById('drawer'),
  drTitle: document.getElementById('drTitle'),
  drFolders: document.getElementById('drFolders')
};
var hudSegs = [];
if (hudEls.bar && hudEls.bar.querySelectorAll) {
  hudSegs = Array.prototype.slice.call(hudEls.bar.querySelectorAll('.hb-seg'));
}
var hudCache = { score: -1, level: -1, combo: -1, hearts: -1, sig: '', time: -1 };
var bannerTimer = null, flashTimer = null;
var newBestShown = false;

function popEl(el) {
  if (!el || !el.classList) return;
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}
function showBanner(text) {
  if (!hudEls.banner || !hudEls.banner.classList) return;
  hudEls.banner.textContent = text;
  hudEls.banner.classList.remove('show');
  void hudEls.banner.offsetWidth;
  hudEls.banner.classList.add('show');
  if (bannerTimer) clearTimeout(bannerTimer);
  bannerTimer = setTimeout(function () {
    if (hudEls.banner && hudEls.banner.classList) hudEls.banner.classList.remove('show');
  }, 1150);
}
function flashCard() {
  if (!hudEls.card || !hudEls.card.classList) return;
  hudEls.card.classList.remove('flash');
  void hudEls.card.offsetWidth;
  hudEls.card.classList.add('flash');
  if (flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(function () {
    if (hudEls.card && hudEls.card.classList) hudEls.card.classList.remove('flash');
  }, 450);
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function paintIcon(cv, id) {
  if (!cv || !cv.getContext) return;
  var c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  drawMap(c, ICON_MAPS[BY_ID[id].icon], ICON_PAL, 0, 0, 3);
}
function updateHUD() {
  if (!hudEls.root || !hudEls.root.classList) return;
  var playing = state === 'play' || state === 'paused';
  hudEls.root.classList.toggle('hud-hidden', !playing);
  hudEls.root.classList.toggle('dimmed', state === 'paused');
  if (hudEls.pause) hudEls.pause.textContent = state === 'paused' ? '\u25B6' : '\u23F8';
  // folder drawer: close it on game over, dim it while paused
  if (!playing) {
    if (drawer) closeDrawer(true);
  } else if (hudEls.drawer && hudEls.drawer.classList) {
    hudEls.drawer.classList.toggle('dr-dimmed', state === 'paused');
  }
  if (!playing) return;

  // score (+ new-best milestone juice)
  if (hudEls.score && hudCache.score !== score) {
    hudCache.score = score;
    hudEls.score.textContent = score;
    popEl(hudEls.score);
    if (score > best && !newBestShown) {
      newBestShown = true;
      showBanner('NEW BEST!');
      shakeT = Math.max(shakeT, 0.22);
      burst(36, 60, '#ffd166', 16);
      SFX.level();
    }
  }
  // level (+ level-up juice)
  if (hudEls.level && hudCache.level !== level) {
    hudCache.level = level;
    hudEls.level.textContent = level;
    popEl(hudEls.level);
    if (level > 1) {
      showBanner('LEVEL ' + level + '!');
      shakeT = Math.max(shakeT, 0.3);
      burst(192, 100, '#ffd166', 18);
    }
  }
  // combo chip
  if (hudEls.combo) {
    if (combo > 1) {
      hudEls.combo.hidden = false;
      if (hudCache.combo !== combo) {
        hudCache.combo = combo;
        hudEls.combo.textContent = 'x' + combo;
        popEl(hudEls.combo);
      }
    } else {
      hudEls.combo.hidden = true;
      hudCache.combo = -1;
    }
  }
  // neon battery health bar
  if (hudCache.hearts !== hearts) {
    hudCache.hearts = hearts;
    for (var i = 0; i < hudSegs.length; i++) {
      if (hudSegs[i].classList) hudSegs[i].classList.toggle('on', i < hearts);
    }
    if (hudEls.bar && hudEls.bar.classList) hudEls.bar.classList.toggle('low', hearts === 1);
  }
  // order card
  if (!order) {
    if (hudEls.card && !hudEls.card.classList.contains('hidden')) hudEls.card.classList.add('hidden');
    return;
  }
  if (hudEls.card && hudEls.card.classList) {
    var justShown = hudEls.card.classList.contains('hidden');
    hudEls.card.classList.remove('hidden');
    if (justShown) { hudEls.card.classList.remove('pop'); void hudEls.card.offsetWidth; hudEls.card.classList.add('pop'); }
  }
  // items (rebuild only when the order's item+folder+spec set changes; done-state animates)
  var sig = order.items.map(function (id) {
    var s = order.specs[id];
    return id + ':' + order.folders[id] + '|' + s.color + '/' + s.align + '/' + s.brand;
  }).join(',');
  if (sig !== hudCache.sig && hudEls.items) {
    hudCache.sig = sig;
    var html = '';
    for (var k = 0; k < order.items.length; k++) {
      var pid = order.items[k];
      var col = BY_ID[pid].color;
      var s2 = order.specs[pid];
      html += '<span class="oc-item"><canvas class="ic" width="24" height="18"></canvas>' +
              '<span class="oc-item-meta">' +
              '<span class="oc-item-name">' + BY_ID[pid].name + '</span>' +
              '<span class="oc-item-folder"><span class="folder-ic" style="--dr-accent:' + col + '"></span>' + escapeHtml(order.folders[pid]) + '</span>' +
              '<span class="oc-item-spec"><span class="color-dot" style="background:' + (COLOR_HEX[s2.color] || '#888888') + '"></span>' +
              escapeHtml(s2.color + ' \u00B7 ' + s2.align + ' \u00B7 ' + s2.brand) + '</span>' +
              '</span></span>';
    }
    hudEls.items.innerHTML = html;
    var cvs = hudEls.items.querySelectorAll ? hudEls.items.querySelectorAll('canvas.ic') : [];
    for (var q = 0; q < cvs.length; q++) paintIcon(cvs[q], order.items[q]);
  }
  var itemEls = hudEls.items && hudEls.items.querySelectorAll ? hudEls.items.querySelectorAll('.oc-item') : [];
  for (var r = 0; r < itemEls.length; r++) {
    if (itemEls[r].classList) itemEls[r].classList.toggle('done', order.done.indexOf(order.items[r]) >= 0);
  }
  // timer bar (width + pulse/shine colors)
  if (hudEls.fill) {
    var frac = order.timer / order.timerMax;
    hudEls.fill.style.width = (frac * 100).toFixed(1) + '%';
    hudEls.fill.classList.toggle('mid', frac <= 0.5 && frac > 0.25);
    hudEls.fill.classList.toggle('low', frac <= 0.25);
  }
  if (hudEls.time) {
    var secs = Math.ceil(order.timer);
    if (hudCache.time !== secs) { hudCache.time = secs; hudEls.time.textContent = secs + 's'; }
    hudEls.time.classList.toggle('low', order.timer <= 3);
  }
}
/* HUD scales with the canvas: --hud = canvas CSS width / 1536 */
function updateHudScale() {
  var wrap = document.getElementById('wrap');
  if (wrap && wrap.clientWidth) {
    document.documentElement.style.setProperty('--hud', (wrap.clientWidth / 1536).toFixed(3));
  }
  if (drawer) positionDrawer();   // keep the open drawer glued to its machine on resize
}
window.addEventListener('resize', updateHudScale);
updateHudScale();
/* DOM pause button (replaces the old canvas hitbox) */
if (hudEls.pause && hudEls.pause.addEventListener) {
  hudEls.pause.addEventListener('click', function () { togglePause(); });
}

/* ---------------- Game-feel particles ---------------- */
/* soft pixel smoke puffs (alpha rects, rise slowly) */
function smoke(x, y, n) {
  for (var i = 0; i < n; i++) {
    particles.push({
      x: x + (Math.random() - .5) * 8, y: y,
      vx: (Math.random() - .5) * 14, vy: -Math.random() * 18 - 5,
      life: .5 + Math.random() * .5,
      color: 'rgba(180,190,210,0.45)', size: 2 + Math.floor(Math.random() * 2)
    });
  }
}
/* the machine's operator starts printing: sparks + smoke burst from the machine */
function beginOperate(mid) {
  var m = machineById(mid);
  if (m) {
    smoke(m.x + m.w / 2, m.y + 2, 6);
    burst(m.x + m.w / 2, m.y + 4, BY_ID[m.id].color, 6);
  }
}
/* bottom hint (moved out of the old canvas HUD) */
function drawHint() {
  if (state === 'play' && hintT > 0 && order) {
    var a = Math.min(1, hintT);
    ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = '#fff'; ctx.font = font(12, true);
    ctx.textAlign = 'center';
    ctx.fillText('PICK UP THE ORDER FROM THE BELT, THEN MATCH IT TO A MACHINE!', VW / 2, VH - 34 * uiScale);
    ctx.globalAlpha = 1;
  }
}
/* pulsing "PICK UP!" label above the box once it has reached the pickup point */
function drawPickupHint() {
  if (state !== 'play') return;
  var b = beltBoxPos();
  if (!b || !b.ready) return;
  var vx = b.x / WBW * VW, vy = b.y / WBH * VH;
  var pu = 0.5 + 0.5 * Math.sin(t * 5);
  ctx.globalAlpha = 0.5 + 0.5 * pu;
  ctx.fillStyle = '#ffd166';
  ctx.font = font(10, true);
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('PICK UP!', vx, vy - 16 * uiScale);
  ctx.globalAlpha = 1;
}

/* ---------------- Main render ---------------- */
function draw() {
  // 1. render the layered world into buffers
  drawWorld();

  // 2. composite: floor -> soft drop shadows -> z-sorted entities (with shake)
  ctx.clearRect(0, 0, VW, VH);
  ctx.save();
  if (shakeT > 0) {
    var sh = shakeT * 10 * uiScale;
    ctx.translate((Math.random() - .5) * sh, (Math.random() - .5) * sh);
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(wbFloor, 0, 0, VW, VH);
  ctx.imageSmoothingEnabled = true;                 // soft shadows are smooth
  drawEntityShadows();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(wbTop, 0, 0, VW, VH);
  ctx.restore();

  // 2.5 ambient neon bloom from the machine screens + warm lighting
  MACHINES.forEach(drawNeonGlow);
  drawLighting();

  // 3. crisp UI
  ctx.imageSmoothingEnabled = true;
  if (state === 'play' || state === 'paused') { drawHint(); drawPickupHint(); drawMachineLabels(); drawPopups(); }
  else if (state === 'start') drawStart();
  else if (state === 'over') drawOver();

  // red flash
  if (flashT > 0) {
    ctx.fillStyle = 'rgba(255,45,85,' + (flashT * 1.6).toFixed(3) + ')';
    rr(ctx, 0, 0, VW, VH, ctx.fillStyle);
  }

  // pause overlay (on top of everything)
  if (state === 'paused') drawPause();

  // machine name tooltip
  if (state === 'play') {
    var m = machineAt(mouse.wx, mouse.wy);
    if (m) {
      var prod = BY_ID[m.id];
      var tw2 = (prod.name.length * 7 + 26) * uiScale;
      var tx2 = Math.min(mouse.vx + 12 * uiScale, VW - tw2 - 8 * uiScale);
      var ty2 = Math.max(mouse.vy - 26 * uiScale, 4 * uiScale);
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; rr(ctx, tx2, ty2, tw2, 22 * uiScale, 'rgba(0,0,0,0.75)');
      ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = font(9, false);
      ctx.fillText(prod.name, tx2 + 10 * uiScale, ty2 + 11 * uiScale);
    }
  }

  // mute badge (bottom-right)
  if (state === 'play') {
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = font(8, true);
    ctx.fillText(muted ? 'SOUND: OFF [M]' : 'SOUND: ON [M]', VW - 12 * uiScale, VH - 10 * uiScale);
  }

  // sync the DOM HUD (score, order card, health bar, banners)
  updateHUD();
}

/* ---------------- Input ---------------- */
function toWorld(e) {
  var r = canvas.getBoundingClientRect();
  var vx = (e.clientX - r.left) / r.width * VW;
  var vy = (e.clientY - r.top) / r.height * VH;
  return { vx: vx, vy: vy, wx: vx / VW * WBW, wy: vy / VH * WBH };
}
canvas.addEventListener('mousemove', function (e) {
  var p = toWorld(e);
  mouse.vx = p.vx; mouse.vy = p.vy; mouse.wx = p.wx; mouse.wy = p.wy;
  var over = (state === 'play' && (machineAt(mouse.wx, mouse.wy) || beltBoxHit(mouse.wx, mouse.wy))) ||
             buttons.some(function (b) { return mouse.vx >= b.x && mouse.vx <= b.x + b.w && mouse.vy >= b.y && mouse.vy <= b.y + b.h; });
  canvas.style.cursor = over ? 'pointer' : 'default';
});
canvas.addEventListener('click', function (e) {
  ensureAudio();
  var p = toWorld(e);
  if (state === 'play') {
    if (!drawer) {
      if (beltBoxHit(p.wx, p.wy)) { pickUpBox(); return; }   // grab the order off the belt
      var m = machineAt(p.wx, p.wy);
      if (m) { clickWorld(m.id); return; }
    }
  }
  // buttons (top-most last)
  for (var i = 0; i < buttons.length; i++) {
    var b = buttons[i];
    if (p.vx >= b.x && p.vx <= b.x + b.w && p.vy >= b.y && p.vy <= b.y + b.h) { b.fn(); return; }
  }
});
window.addEventListener('keydown', function (e) {
  if (e.key === 'm' || e.key === 'M') {
    muted = !muted;
    if (muted) stopMusic();
    else if (state === 'play' || state === 'paused') startMusic();
  }
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && (state === 'play' || state === 'paused')) togglePause();
  if ((e.key === 'Enter' || e.key === ' ') && state === 'start') startGame();
});
// stop the music the moment the player leaves the game (close tab / navigate away)
window.addEventListener('pagehide', stopMusic);
window.addEventListener('beforeunload', stopMusic);

/* ---------------- Loop ---------------- */
var last = performance.now();
function loop(now) {
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Debug/test hook (harmless; lets scripts drive the game headlessly)
window.__PRINT_RUSH__ = {
  get state() { return state; },
  get score() { return score; },
  get hearts() { return hearts; },
  get level() { return level; },
  get ordersDone() { return ordersDone; },
  get order() { return order; },
  get operators() { return operators; },
  get runner() { return runner; },
  operatorFor: operatorFor,
  get drawer() { return drawer; },
  get musicOn() { return musicOn; },
  get missing() { return missing; },
  get missAnim() { return missAnim; },
  get beltT() { return beltT; },
  get beltBox() { return beltBoxPos(); },
  get VW() { return VW; },
  get VH() { return VH; },
  start: startGame,
  pause: togglePause,
  click: clickWorld,
  pickUp: pickUpBox,
  pickFolder: drawerPick,
  tick: function (dt) { update(dt); },
  machineAt: machineAt,
  machines: MACHINES,
  folders: FOLDERS,
  specs: FOLDER_SPECS,
  aligns: ALIGNS
};

})();
</script>
