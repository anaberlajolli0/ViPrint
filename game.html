<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <!-- ===================== DOM HUD OVERLAY (HTML/CSS) ===================== -->
  <div id="hud">
    <div id="hud-left">
      <div class="hud-block">
        <span class="hud-label">SCORE</span>
        <span class="hud-value" id="hudScore">0</span>
        <span class="hud-combo" id="hudCombo" hidden>x1</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">LEVEL</span>
        <span class="hud-value hud-amber" id="hudLevel">1</span>
      </div>
    </div>
    <div id="hud-center">
      <div id="order-card" class="hidden">
        <div class="oc-top">
          <span class="oc-title">ORDER</span>
          <span class="oc-time" id="ocTime">--</span>
        </div>
        <div class="oc-items" id="ocItems"></div>
        <div class="oc-bar"><div class="oc-fill" id="ocFill"></div></div>
      </div>
    </div>
    <div id="hud-right">

        <span class="hb-seg"></span><span class="hb-seg"></span><span class="hb-seg"></span>
      </div>
      <button id="pauseBtn" class="pause-btn" type="button" aria-label="Pause game">&#9208;</button>
    </div>
  </div>
  <div id="banner"></div>
</div>

<script>
(function () {
'use strict';

/* ======================================================================
   PRINT RUSH — a ViPrint factory game
   Top-down pixel art. Match the customer order to the right machine!
   ====================================================================== */

/* ---------------- Canvas / buffers ---------------- */
var WBW = 384, WBH = 216;                 // low-res pixel world
var VW = 1536, VH = 864;                  // fixed 4x crisp resolution (WBW*4, WBH*4)
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var wbFloor = document.createElement('canvas');       // LAYER 0: floor/decor
wbFloor.width = WBW; wbFloor.height = WBH;
var wbFloorCtx = wbFloor.getContext('2d');
var wctx = wbFloorCtx;                                // active world ctx (switched per layer)
var wbTop = document.createElement('canvas');         // LAYER 2: z-sorted entities
wbTop.width = WBW; wbTop.height = WBH;
var wbTopCtx = wbTop.getContext('2d');
var uiScale = VW / 960;                   // crisp UI designed at 960x540

canvas.width = VW; canvas.height = VH;    // canvas is exactly 4x the pixel world;
                                          // CSS scales the element to fit (nearest-neighbor)

/* ---------------- Pixel helpers ---------------- */
function drawMap(ctx2, map, pal, x, y, s) {
  for (var r = 0; r < map.length; r++) {
    for (var c = 0; c < map[r].length; c++) {
      var ch = map[r][c];
      if (ch === '.' || ch === ' ') continue;
      var col = pal[ch];
      if (col) { ctx2.fillStyle = col; ctx2.fillRect(x + c * s, y + r * s, s, s); }
    }
  }
}
function rr(ctx2, x, y, w, h, col) { ctx2.fillStyle = col; ctx2.fillRect(x, y, w, h); }
/* '#rrggbb' -> 'r,g,b' for building rgba() strings */
function hexRgb(h) {
  var n = parseInt(h.slice(1), 16);
  return (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
}

/* ---------------- Product icons (pixel maps) ---------------- */
var ICON_MAPS = {
  cards:     ['........', '.BBBBBB.', '.WWWWWW.', '.WWWWWW.', '.WWWWWW.', '........'],
  flyers:    ['........', '.WWWWWW.', '.WKKDDW.', '.WKKDDW.', '.WWWWWW.', '.WWWWWW.'],
  posters:   ['........', '.WWWWWW.', '.WRRRRW.', '.WRRRRW.', '.WWWWWW.', '.W...W.', '.WWWWWW.'],
  books:     ['........', '.PPWWWW.', '.PPWWWW.', '.PPWWWW.', '.PPWWWW.', '.PPPPPP.'],
  packaging: ['........', '.GGGGGG.', '.GWWWWG.', '.GWWWWG.', '.GGGGGG.', '........']
};
var ICON_PAL = { W: '#ffffff', B: '#3d7fe0', D: '#c9ccda', R: '#f0932b', P: '#9b59b6', G: '#2ecc71', K: '#e947a5' };
var HEART = ['.RR.RR.', 'RRRRRRR', 'RRRRRRR', '.RRRRR.', '..RRR..', '...R...'];

/* ---------------- Products & machines ---------------- */
var PRODUCTS = [
  { id: 'cards',     name: 'Business Cards', color: '#3d7fe0', icon: 'cards' },
  { id: 'flyers',    name: 'Flyers',         color: '#e947a5', icon: 'flyers' },
  { id: 'posters',   name: 'Posters',        color: '#f0932b', icon: 'posters' },
  { id: 'books',     name: 'Books',          color: '#9b59b6', icon: 'books' },
  { id: 'packaging', name: 'Packaging',      color: '#2ecc71', icon: 'packaging' }
];
var BY_ID = {};
PRODUCTS.forEach(function (p) { BY_ID[p.id] = p; });

var MACHINES = [
  { id: 'cards',     x: 16,  y: 92,  w: 60, h: 46, flash: 0, buzz: 0 },
  { id: 'flyers',    x: 16,  y: 158, w: 60, h: 46, flash: 0, buzz: 0 },
  { id: 'posters',   x: 308, y: 92,  w: 60, h: 46, flash: 0, buzz: 0 },
  { id: 'books',     x: 308, y: 158, w: 60, h: 46, flash: 0, buzz: 0 },
  { id: 'packaging', x: 162, y: 170, w: 60, h: 46, flash: 0, buzz: 0 }
];
function machineById(id) {
  for (var i = 0; i < MACHINES.length; i++) if (MACHINES[i].id === id) return MACHINES[i];
  return null;
}

/* ---------------- Game state ---------------- */
var state = 'start';            // start | play | over
var score = 0, best = 0, streak = 0, combo = 1;
var hearts = 3, level = 1, ordersDone = 0;
var order = null;               // { items:[id], done:[], timer, timerMax, n }
var orderDelay = 0;             // countdown before next order spawns
var worker = { x: 192, y: 118, hx: 192, hy: 118, state: 'idle', pending: null, opT: 0, bob: 0, handoffDone: false };
var runner = { x: 192, y: 48, hx: 192, hy: 48, state: 'wait', box: false, pending: null, opT: 0, bob: 0, dx: 0, dy: 0 };
var particles = [], popups = [], flying = [];
var shakeT = 0, flashT = 0, hintT = 6;
var mouse = { wx: -1, wy: -1, vx: -1, vy: -1, down: false };
var t = 0;
var buttons = [];               // crisp UI buttons {x,y,w,h,label,fn,sub}
var bestKey = 'printrush_best';
try { best = +localStorage.getItem(bestKey) || 0; } catch (e) {}

/* ---------------- Audio (WebAudio, tiny) ---------------- */
var AC = null, muted = false;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function beep(freq, dur, type, vol, delay) {
  if (muted || !AC) return;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  var t0 = AC.currentTime + (delay || 0);
  g.gain.setValueAtTime(vol || 0.18, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
var SFX = {
  correct: function () { beep(660, .09, 'square', .16); beep(880, .12, 'square', .16, .09); beep(1174, .14, 'square', .14, .18); },
  wrong:   function () { beep(150, .22, 'sawtooth', .2); beep(95, .28, 'sawtooth', .18, .12); },
  print:   function () { beep(210, .05, 'square', .12); beep(150, .06, 'square', .1, .06); },
  order:   function () { beep(520, .06, 'square', .1); },
  miss:    function () { beep(200, .18, 'triangle', .2); beep(130, .26, 'triangle', .18, .14); },
  level:   function () { beep(523, .1, 'square', .15); beep(659, .1, 'square', .15, .1); beep(784, .16, 'square', .15, .2); },
  over:    function () { beep(392, .16, 'square', .16); beep(330, .16, 'square', .16, .15); beep(262, .16, 'square', .16, .3); beep(196, .4, 'square', .16, .45); },
  click:   function () { beep(700, .04, 'square', .1); }
};

/* ---------------- Difficulty ---------------- */
function levelFor(done) { return 1 + Math.floor(done / 5); }
function unlocked(level) {
  var ids = ['cards', 'flyers', 'posters'];
  if (level >= 2) ids.push('books');
  if (level >= 3) ids.push('packaging');
  return ids;
}
function orderTime(level, n) {
  var base = Math.max(6, 13.5 - (level - 1) * 1.1);
  return +(base + (n > 1 ? 4.5 : 0)).toFixed(1);
}
function pickDistinct(pool, n) {
  var copy = pool.slice(), out = [];
  while (out.length < n && copy.length) {
    out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
  }
  return out;
}
function makeOrder() {
  var lvl = levelFor(ordersDone);
  var pool = unlocked(lvl);
  var n = 1;
  if (lvl >= 3 && Math.random() < Math.min(.55, (lvl - 2) * .12)) n = 2;
  if (lvl >= 6 && Math.random() < .15) n = 3;
  var items = pickDistinct(pool, Math.min(n, pool.length));
  var tm = orderTime(lvl, items.length);
  order = { items: items, done: [], timer: tm, timerMax: tm, n: items.length };
  SFX.order();
}
function nextOrderSoon() { order = null; orderDelay = 0.65; }

/* ---------------- Game actions ---------------- */
function startGame() {
  ensureAudio();
  score = 0; streak = 0; combo = 1; hearts = 3; level = 1; ordersDone = 0;
  order = null; orderDelay = 0.4; particles = []; popups = []; flying = [];
  worker.state = 'idle'; worker.pending = null; worker.handoffDone = false;
  worker.x = worker.hx = 192; worker.y = worker.hy = 118;
  runner.state = 'wait'; runner.box = false; runner.pending = null;
  runner.x = runner.hx = 192; runner.y = runner.hy = 48;
  hintT = 6; shakeT = 0; flashT = 0;
  newBestShown = false;
  hudCache.score = -1; hudCache.level = -1; hudCache.combo = -1;
  hudCache.hearts = -1; hudCache.sig = ''; hudCache.time = -1;
  state = 'play';
  SFX.level();
}
function applyResult(mid) {
  if (!order || state !== 'play') return;
  if (order.done.indexOf(mid) >= 0) return;
  var idx = order.items.indexOf(mid);
  var m = machineById(mid);
  if (idx >= 0) {
    // SUCCESS
    order.done.push(mid);
    streak++;
    combo = Math.min(5, 1 + Math.floor(streak / 2));
    var pts = 10 * combo;
    score += pts;
    m.flash = 0.5;
    var prod = BY_ID[mid];
    spawnFlying(prod, m);
    popup(prod.name, m, '#7dffa8');
    popup('+' + pts + (combo > 1 ? '  x' + combo : ''), m, '#ffd166');
    SFX.correct();
    if (order.done.length === order.items.length) {
      ordersDone++;
      var nl = levelFor(ordersDone);
      if (nl > level) {
        level = nl;
        SFX.level();                       // DOM banner + screen shake handled in updateHUD
      }
      burst(m.x + m.w / 2, m.y + 2, prod.color, 14);
      smoke(m.x + m.w / 2, m.y, 8);
      flashCard();
      nextOrderSoon();
    }
  } else {
    // WRONG
    streak = 0; combo = 1;
    m.buzz = 0.5; m.flash = 0.3;
    if (order) order.timer = Math.max(0.5, order.timer - 2);
    shakeT = 0.28; flashT = 0.22;
    popup('WRONG!  -2s', m, '#ff6b6b');
    SFX.wrong();
  }
}
function missOrder() {
  hearts--;
  streak = 0; combo = 1;
  shakeT = 0.35; flashT = 0.3;
  popup('ORDER MISSED!', { x: WBW / 2, y: 90 }, '#ff6b6b');
  SFX.miss();
  worker.pending = null; worker.handoffDone = false;
  worker.state = 'idle';
  worker.hx = 192; worker.hy = 118;
  runner.box = false; runner.pending = null;
  runner.state = 'return';
  runner.hx = 192; runner.hy = 48;
  if (hearts <= 0) {
    state = 'over';
    SFX.over();
    if (score > best) { best = score; try { localStorage.setItem(bestKey, best); } catch (e) {} }
  } else {
    nextOrderSoon();
  }
}
function clickWorld(mid) {
  if (!order) return;
  if (order.done.indexOf(mid) >= 0) return;
  if (runner.state === 'deliver' || runner.state === 'handoff') return;   // busy
  var m = machineById(mid);
  // operator walks to the machine
  worker.pending = mid;
  worker.handoffDone = false;
  worker.state = 'walk';
  worker.hx = m.x + m.w / 2 - 3;
  worker.hy = m.y + m.h / 2 + 2;
  // runner carries the order over
  runner.pending = mid;
  if (runner.box) {
    runner.state = 'deliver';
    runnerDeliverTarget(mid);
  } else {
    runner.state = 'fetch';
    runner.hx = 192; runner.hy = 30;
  }
  SFX.click();
}
function runnerDeliverTarget(mid) {
  var dm = machineById(mid);
  runner.hx = dm.x + dm.w / 2 + 10; runner.hy = dm.y + dm.h / 2 + 2;   // stand IN FRONT (right side)
  runner.dx = dm.x + dm.w / 2 - 8; runner.dy = dm.y - 5;              // box lands on the machine top
}
function moveToward(ent, tx, ty, speed, dt) {
  var dx = tx - ent.x, dy = ty - ent.y;
  var d = Math.sqrt(dx * dx + dy * dy);
  var sp = speed * dt;
  if (d <= sp) { ent.x = tx; ent.y = ty; return true; }
  ent.x += dx / d * sp; ent.y += dy / d * sp; return false;
}

/* ---------------- Entities ---------------- */
function spawnFlying(prod, m) {
  flying.push({
    icon: prod.icon, color: prod.color,
    sx: m.x + m.w / 2, sy: m.y + 4,
    tx: 348, ty: 40,
    t: 0, dur: 0.65
  });
}
function popup(text, where, color) {
  popups.push({ text: text, x: where.x, y: where.y, color: color, life: 1.1, vy: -14 });
}
function burst(x, y, color, n) {
  for (var i = 0; i < n; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - .5) * 60, vy: -Math.random() * 70 - 10,
      life: .7 + Math.random() * .5, color: color, size: 1 + (Math.random() < .5 ? 1 : 0)
    });

}

/* ---------------- Update ---------------- */
function update(dt) {
  if (state === 'paused') return;   // freeze the factory while paused
  t += dt;
  if (flashT > 0) flashT -= dt;
  if (shakeT > 0) shakeT -= dt;
  if (hintT > 0 && state === 'play') hintT -= dt;

  // worker (operator) + runner (order carrier) choreography
  if (state === 'play') {
    // --- worker: walks to the machine, operates once the box is handed off ---
    if (worker.state === 'walk') {
      var dx = worker.hx - worker.x, dy = worker.hy - worker.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      var sp = 150 * dt;
      if (d <= sp) {
        worker.x = worker.hx; worker.y = worker.hy;
        if (worker.handoffDone) { beginOperate(); }
        else { worker.state = 'standby'; }
      } else {
        worker.x += dx / d * sp; worker.y += dy / d * sp;
      }
    } else if (worker.state === 'standby') {
      if (worker.handoffDone) { beginOperate(); }
    } else if (worker.state === 'operate') {
      worker.opT -= dt;
      var m = worker.pending ? machineById(worker.pending) : null;
      if (m) m.flash = Math.max(m.flash, 0.35);
      if (worker.opT <= 0) {
        var pid = worker.pending;
        worker.pending = null; worker.handoffDone = false;
        worker.state = 'walk';
        worker.hx = 192; worker.hy = 118; // back to post
        if (pid) applyResult(pid);
      }
    } else {
      // idle: drift back to post
      var ddx = 192 - worker.x, ddy = 118 - worker.y;
      var dd = Math.sqrt(ddx * ddx + ddy * ddy);
      if (dd > 2) { worker.x += ddx / dd * 60 * dt; worker.y += ddy / dd * 60 * dt; }
    }
    worker.bob += dt * (worker.state === 'walk' ? 9 : 3);

    // --- runner: fetch box from the belt, carry it to the clicked machine ---
    switch (runner.state) {
      case 'wait':
        if (order && !runner.box) { runner.state = 'fetch'; runner.hx = 192; runner.hy = 30; }
        break;
      case 'fetch':
        if (moveToward(runner, 192, 30, 165, dt)) {
          runner.box = true;
          if (runner.pending) {
            runner.state = 'deliver';
            runnerDeliverTarget(runner.pending);
          } else runner.state = 'ready';
        }
        break;
      case 'ready':
        break;
      case 'deliver':
        if (moveToward(runner, runner.hx, runner.hy, 165, dt)) {
          runner.state = 'handoff'; runner.opT = 0.35;
        }
        break;
      case 'handoff':
        runner.opT -= dt;
        if (runner.opT <= 0) {
          runner.box = false;
          worker.handoffDone = true;      // operator starts printing
          SFX.print();
          runner.state = 'return';
          runner.hx = 192; runner.hy = 48;
        }
        break;
      case 'return':
        if (moveToward(runner, 192, 48, 165, dt)) {
          runner.state = 'wait'; runner.pending = null;
        }
        break;
    }
    runner.bob += dt * ((runner.state === 'fetch' || runner.state === 'deliver' || runner.state === 'return') ? 9 : 3);

    // order spawn
    if (!order) {
      orderDelay -= dt;
      if (orderDelay <= 0) makeOrder();
    } else {
      order.timer -= dt;
      if (order.timer <= 0) { order.timer = 0; missOrder(); }
    }
  }

  // machines decay
  MACHINES.forEach(function (m) {
    if (m.flash > 0) m.flash -= dt;
    if (m.buzz > 0) m.buzz -= dt;
  });

  // particles
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  // popups (view-space, seconds)
  for (var j = popups.length - 1; j >= 0; j--) {
    var pp = popups[j];
    pp.life -= dt; pp.y += pp.vy * dt;
    if (pp.life <= 0) popups.splice(j, 1);
  }
  // flying products (world-space)
  for (var k = flying.length - 1; k >= 0; k--) {
    var f = flying[k];
    f.t += dt;
    if (f.t >= f.dur) {
      flying.splice(k, 1);
      burst(f.tx, f.ty, f.color, 10);
    } else {
      var u = f.t / f.dur;
      var ease = 1 - Math.pow(1 - u, 3);
      f.x = f.sx + (f.tx - f.sx) * ease;
      f.y = f.sy + (f.ty - f.sy) * ease - Math.sin(Math.PI * u) * 46;
    }
  }
}

/* Stardew-style human sprite: dark outline silhouette + hair/face/shirt/pants/boots.
   Parts are drawn shifted ±1px in outline color first (cheap silhouette outline),
   then in their real colors on top. */
function buildHumanParts(opt, x, y) {
  var P = [];
  function add(xx, yy, w, h, col) { P.push([xx, yy, w, h, col]); }
  var step = Math.sin(opt.bob) > 0 ? 1 : 0;
  var walk = opt.walk;
  var l1 = walk ? step * 2 : 0, l2 = walk ? (1 - step) * 2 : 0;
  var sway = walk ? (step ? 1 : -1) : 0;
  // head: cap + hair + neck
  add(x - 5, y - 25, 10, 3, opt.cap);
  add(x - 5, y - 24, 2, 2, opt.capShade);          // cap brim
  add(x - 4, y - 22, 8, 7, opt.hair);
  add(x - 2, y - 21, 4, 2, opt.hairHi);            // hair highlight
  add(x - 3, y - 15, 6, 2, opt.skin);              // neck
  add(x - 3, y - 15, 2, 2, opt.skinShade);
  // torso
  add(x - 6, y - 13, 12, 8, opt.shirt);
  add(x - 6, y - 13, 2, 8, opt.shirtShade);
  add(x + 4, y - 13, 2, 2, opt.shirtHi);
  if (opt.stripe) add(x - 5, y - 9, 10, 2, opt.stripe);   // hi-vis stripe
  // arms (+ hands)
  if (opt.carry) {
    add(x - 8, y - 18, 2, 7, opt.shirt);
    add(x + 7, y - 18, 2, 7, opt.shirt);
    add(x - 8, y - 12, 2, 2, opt.skin);
    add(x + 7, y - 12, 2, 2, opt.skin);
  } else if (opt.operate) {
    add(x - 8, y - 15, 2, 5, opt.shirt);
    add(x + 7, y - 15, 2, 5, opt.shirt);
    add(x - 8, y - 11, 2, 2, opt.skin);
    add(x + 7, y - 11, 2, 2, opt.skin);
  } else {
    add(x - 8, y - 12 + sway, 2, 6, opt.shirt);
    add(x + 7, y - 12 - sway, 2, 6, opt.shirt);
    add(x - 8, y - 6 + sway, 2, 3, opt.skin);
    add(x + 7, y - 6 - sway, 2, 3, opt.skin);
  }
  // belt + pants
  add(x - 6, y - 6, 12, 2, opt.pants);
  add(x - 1, y - 6, 3, 2, '#ffd166');              // belt buckle
  add(x - 5, y - 5, 10, 3, opt.pants);
  // legs + boots (walk alternation)
  add(x - 4, y - 4 - l1, 3, 4, opt.pants);
  add(x + 2, y - 4 - l2, 3, 4, opt.pants);
  add(x - 5, y - 2 - l1, 4, 3, opt.boot);
  add(x + 2, y - 2 - l2, 4, 3, opt.boot);
  return P;
}

  if (runner.box && runner.state !== 'handoff') {
    drawOrderBox(runner.x - 8, runner.y - 28, 16, 11);

  }

/* ---------------- Soft drop shadows (Canvas shadow API) ---------------- */
function drawSoftShadow(vx, vy, rx, ry, blur, offY, alpha) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,' + (alpha || 0.4) + ')';
  ctx.shadowBlur = blur;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = offY;
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(vx, vy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
/* draws a soft drop shadow beneath every machine and character, between the
   floor layer and the entity layer, so bodies cover the shadow core and only
   the blurred halo remains visible on the floor. */
function drawEntityShadows() {
  var kx = VW / WBW, ky = VH / WBH;
  for (var i = 0; i < MACHINES.length; i++) {
    var m = MACHINES[i];
    drawSoftShadow((m.x + m.w / 2) * kx, (m.y + m.h * 0.62) * ky,
      m.w * 0.42 * kx, m.h * 0.26 * ky, 22, 12, 0.42);
  }
  drawSoftShadow(worker.x * kx, worker.y * ky, 11 * kx, 4.4 * ky, 9, 5, 0.4);
  drawSoftShadow(runner.x * kx, runner.y * ky, 11 * kx, 4.4 * ky, 9, 5, 0.4);
}

/* ---------------- Ambient neon illumination nodes ----------------
   Additive ('lighter') radial bloom radiating from each machine screen:
   green for Packaging, purple for Books, blue for Cards, pink for Flyers,
   orange for Posters. Pulses gently; flares up while printing. */
function drawNeonGlow(m) {
  var prod = BY_ID[m.id];
  var active = m.flash > 0;
  var kx = VW / WBW, ky = VH / WBH;
  var vx = (m.x + m.w / 2) * kx;
  var vy = (m.y + m.h - 13) * ky;                  // screen position
  var pulse = 0.5 + 0.5 * Math.sin(t * 2.2 + m.id.length * 1.7);
  var r = Math.max(24, (active ? 150 : 66 + 30 * pulse) * kx * 0.62);
  var g = ctx.createRadialGradient(vx, vy, 2, vx, vy, r);
  g.addColorStop(0, 'rgba(' + hexRgb(prod.color) + ',' + (active ? 0.34 : (0.15 + 0.11 * pulse)).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(' + hexRgb(prod.color) + ',0)');
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';        // additive bloom
  ctx.fillStyle = g;
  ctx.fillRect(vx - r, vy - r, r * 2, r * 2);
  ctx.restore();
}

/* ---------------- Ambient lighting (crisp overlay) ---------------- */
function drawLighting() {
  // warm light pool from the ceiling
  var g = ctx.createRadialGradient(VW / 2, VH * 0.34, VH * 0.08, VW / 2, VH * 0.52, VH * 0.92);
  g.addColorStop(0, 'rgba(255,244,214,0.12)');

  g.addColorStop(1, 'rgba(12,8,24,0.30)');

  // corner vignette
  var v = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.45, VW / 2, VH / 2, VH * 0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)');

}

function updateHUD() {
  if (!hudEls.root || !hudEls.root.classList) return;
  var playing = state === 'play' || state === 'paused';
  hudEls.root.classList.toggle('hud-hidden', !playing);
  hudEls.root.classList.toggle('dimmed', state === 'paused');
  if (hudEls.pause) hudEls.pause.textContent = state === 'paused' ? '\u25B6' : '\u23F8';
  if (!playing) return;

  // score (+ new-best milestone juice)
  if (hudEls.score && hudCache.score !== score) {
    hudCache.score = score;
    hudEls.score.textContent = score;
    popEl(hudEls.score);
    if (score > best && !newBestShown) {
      newBestShown = true;
      showBanner('NEW BEST!');
      shakeT = Math.max(shakeT, 0.22);
      burst(36, 60, '#ffd166', 16);
      SFX.level();
    }
  }
  // level (+ level-up juice)
  if (hudEls.level && hudCache.level !== level) {
    hudCache.level = level;
    hudEls.level.textContent = level;
    popEl(hudEls.level);
    if (level > 1) {
      showBanner('LEVEL ' + level + '!');
      shakeT = Math.max(shakeT, 0.3);
      burst(192, 100, '#ffd166', 18);
    }
  }
  // combo chip
  if (hudEls.combo) {
    if (combo > 1) {
      hudEls.combo.hidden = false;
      if (hudCache.combo !== combo) {
        hudCache.combo = combo;
        hudEls.combo.textContent = 'x' + combo;
        popEl(hudEls.combo);
      }
    } else {
      hudEls.combo.hidden = true;
      hudCache.combo = -1;
    }
  }
  // neon battery health bar
  if (hudCache.hearts !== hearts) {
    hudCache.hearts = hearts;
    for (var i = 0; i < hudSegs.length; i++) {
      if (hudSegs[i].classList) hudSegs[i].classList.toggle('on', i < hearts);
    }
    if (hudEls.bar && hudEls.bar.classList) hudEls.bar.classList.toggle('low', hearts === 1);
  }
  // order card
  if (!order) {
    if (hudEls.card && !hudEls.card.classList.contains('hidden')) hudEls.card.classList.add('hidden');
    return;
  }
  if (hudEls.card && hudEls.card.classList) {
    var justShown = hudEls.card.classList.contains('hidden');
    hudEls.card.classList.remove('hidden');
    if (justShown) { hudEls.card.classList.remove('pop'); void hudEls.card.offsetWidth; hudEls.card.classList.add('pop'); }
  }
  // items (rebuild only when the order's item set changes; done-state animates)
  var sig = order.items.join(',');
  if (sig !== hudCache.sig && hudEls.items) {
    hudCache.sig = sig;
    var html = '';
    for (var k = 0; k < order.items.length; k++) {
      var pid = order.items[k];
      html += '<span class="oc-item"><canvas class="ic" width="24" height="18"></canvas>' + BY_ID[pid].name + '</span>';
    }
    hudEls.items.innerHTML = html;
    var cvs = hudEls.items.querySelectorAll ? hudEls.items.querySelectorAll('canvas.ic') : [];
    for (var q = 0; q < cvs.length; q++) paintIcon(cvs[q], order.items[q]);
  }
  var itemEls = hudEls.items && hudEls.items.querySelectorAll ? hudEls.items.querySelectorAll('.oc-item') : [];
  for (var r = 0; r < itemEls.length; r++) {
    if (itemEls[r].classList) itemEls[r].classList.toggle('done', order.done.indexOf(order.items[r]) >= 0);
  }
  // timer bar (width + pulse/shine colors)
  if (hudEls.fill) {
    var frac = order.timer / order.timerMax;
    hudEls.fill.style.width = (frac * 100).toFixed(1) + '%';
    hudEls.fill.classList.toggle('mid', frac <= 0.5 && frac > 0.25);
    hudEls.fill.classList.toggle('low', frac <= 0.25);
  }
  if (hudEls.time) {
    var secs = Math.ceil(order.timer);
    if (hudCache.time !== secs) { hudCache.time = secs; hudEls.time.textContent = secs + 's'; }
    hudEls.time.classList.toggle('low', order.timer <= 3);
  }
}
/* HUD scales with the canvas: --hud = canvas CSS width / 1536 */
function updateHudScale() {
  var wrap = document.getElementById('wrap');
  if (wrap && wrap.clientWidth) {
    document.documentElement.style.setProperty('--hud', (wrap.clientWidth / 1536).toFixed(3));
  }
}
window.addEventListener('resize', updateHudScale);
updateHudScale();
/* DOM pause button (replaces the old canvas hitbox) */
if (hudEls.pause && hudEls.pause.addEventListener) {
  hudEls.pause.addEventListener('click', function () { togglePause(); });
}

/* ---------------- Game-feel particles ---------------- */
/* soft pixel smoke puffs (alpha rects, rise slowly) */
function smoke(x, y, n) {
  for (var i = 0; i < n; i++) {
    particles.push({
      x: x + (Math.random() - .5) * 8, y: y,
      vx: (Math.random() - .5) * 14, vy: -Math.random() * 18 - 5,
      life: .5 + Math.random() * .5,
      color: 'rgba(180,190,210,0.45)', size: 2 + Math.floor(Math.random() * 2)
    });
  }
}
/* worker starts printing: sparks + smoke burst from the machine */
function beginOperate() {
  worker.state = 'operate'; worker.opT = 0.5;
  var m = worker.pending ? machineById(worker.pending) : null;
  if (m) {
    smoke(m.x + m.w / 2, m.y + 2, 6);
    burst(m.x + m.w / 2, m.y + 4, BY_ID[m.id].color, 6);
  }
}
/* bottom hint (moved out of the old canvas HUD) */
function drawHint() {
  if (state === 'play' && hintT > 0 && order) {
    var a = Math.min(1, hintT);
    ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = '#fff'; ctx.font = font(12, true);
    ctx.textAlign = 'center';
    ctx.fillText('CLICK THE MACHINE THAT MATCHES THE ORDER!', VW / 2, VH - 34 * uiScale);
    ctx.globalAlpha = 1;
  }
}

/* ---------------- Main render ---------------- */
function draw() {
  // 1. render the layered world into buffers
  drawWorld();

  // 2. composite: floor -> soft drop shadows -> z-sorted entities (with shake)
  ctx.clearRect(0, 0, VW, VH);
  ctx.save();
  if (shakeT > 0) {
    var sh = shakeT * 10 * uiScale;
    ctx.translate((Math.random() - .5) * sh, (Math.random() - .5) * sh);
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(wbFloor, 0, 0, VW, VH);
  ctx.imageSmoothingEnabled = true;                 // soft shadows are smooth
  drawEntityShadows();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(wbTop, 0, 0, VW, VH);
  ctx.restore();

  // 2.5 ambient neon bloom from the machine screens + warm lighting
  MACHINES.forEach(drawNeonGlow);
  drawLighting();

  // 3. crisp UI
  ctx.imageSmoothingEnabled = true;
  if (state === 'play' || state === 'paused') { drawHint(); drawMachineLabels(); drawPopups(); }
  else if (state === 'start') drawStart();
  else if (state === 'over') drawOver();

  // red flash
  if (flashT > 0) {
    ctx.fillStyle = 'rgba(255,45,85,' + (flashT * 1.6).toFixed(3) + ')';
    rr(ctx, 0, 0, VW, VH, ctx.fillStyle);
  }

  // pause overlay (on top of everything)
  if (state === 'paused') drawPause();

  // machine name tooltip
  if (state === 'play') {
    var m = machineAt(mouse.wx, mouse.wy);
    if (m) {
      var prod = BY_ID[m.id];
      var tw2 = (prod.name.length * 7 + 26) * uiScale;
      var tx2 = Math.min(mouse.vx + 12 * uiScale, VW - tw2 - 8 * uiScale);
      var ty2 = Math.max(mouse.vy - 26 * uiScale, 4 * uiScale);
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; rr(ctx, tx2, ty2, tw2, 22 * uiScale, 'rgba(0,0,0,0.75)');
      ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = font(9, false);
      ctx.fillText(prod.name, tx2 + 10 * uiScale, ty2 + 11 * uiScale);
    }
  }

  // mute badge (bottom-right)
  if (state === 'play') {
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = font(8, true);
    ctx.fillText(muted ? 'SOUND: OFF [M]' : 'SOUND: ON [M]', VW - 12 * uiScale, VH - 10 * uiScale);
  }

  // sync the DOM HUD (score, order card, health bar, banners)
  updateHUD();
}

/* ---------------- Input ---------------- */
function toWorld(e) {
  var r = canvas.getBoundingClientRect();
  var vx = (e.clientX - r.left) / r.width * VW;
  var vy = (e.clientY - r.top) / r.height * VH;
  return { vx: vx, vy: vy, wx: vx / VW * WBW, wy: vy / VH * WBH };
}
canvas.addEventListener('mousemove', function (e) {
  var p = toWorld(e);
  mouse.vx = p.vx; mouse.vy = p.vy; mouse.wx = p.wx; mouse.wy = p.wy;
  var over = (state === 'play' && machineAt(mouse.wx, mouse.wy)) ||
             buttons.some(function (b) { return mouse.vx >= b.x && mouse.vx <= b.x + b.w && mouse.vy >= b.y && mouse.vy <= b.y + b.h; });
  canvas.style.cursor = over ? 'pointer' : 'default';
});
canvas.addEventListener('click', function (e) {
  ensureAudio();
  var p = toWorld(e);
  if (state === 'play') {
    var m = machineAt(p.wx, p.wy);
    if (m) { clickWorld(m.id); return; }
  }
  // buttons (top-most last)
  for (var i = 0; i < buttons.length; i++) {
    var b = buttons[i];
    if (p.vx >= b.x && p.vx <= b.x + b.w && p.vy >= b.y && p.vy <= b.y + b.h) { b.fn(); return; }
  }
});
window.addEventListener('keydown', function (e) {
  if (e.key === 'm' || e.key === 'M') { muted = !muted; }
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && (state === 'play' || state === 'paused')) togglePause();
  if ((e.key === 'Enter' || e.key === ' ') && state === 'start') startGame();
});

/* ---------------- Loop ---------------- */
var last = performance.now();
function loop(now) {
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Debug/test hook (harmless; lets scripts drive the game headlessly)
window.__PRINT_RUSH__ = {
  get state() { return state; },
  get score() { return score; },
  get hearts() { return hearts; },
  get level() { return level; },
  get ordersDone() { return ordersDone; },
  get order() { return order; },
  get worker() { return worker; },
  get runner() { return runner; },
  get VW() { return VW; },
  get VH() { return VH; },
  start: startGame,
  pause: togglePause,
  click: clickWorld,
  tick: function (dt) { update(dt); },
  machineAt: machineAt,
  machines: MACHINES
};

})();
</script>
</body>
